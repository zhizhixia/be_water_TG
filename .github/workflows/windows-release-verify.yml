# main只做新旧回归；v2标签构建新版，保留草稿供下载核验后再公开。
name: windows-release-verify

on:
  push:
    tags:
      - "v2.*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    name: 新旧测试与新版发布验证 (Windows / Python 3.11)
    runs-on: windows-latest
    steps:
      - name: 检出对应提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 uv 并准备 Python 3.11
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: 同步新旧版本锁定依赖
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv sync --project rewrite --frozen --all-groups

      # runner是无真实数据的干净检出；本机旧版测试不能直接照此在历史数据旁执行。
      - name: 运行旧版回归
        shell: bash
        run: uv run --frozen pytest tests -v --tb=short

      - name: 运行新版回归
        shell: bash
        run: uv run --project rewrite --frozen --all-groups pytest -c rewrite/pytest.ini rewrite/tests -v --tb=short

      - name: 构建新版 Windows 完整目录包
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          uv run --project rewrite --frozen --all-groups python rewrite/build.py 2>&1 | tee build-output.txt

      - name: 独立核对新版归档与校验文件
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          uv run --project rewrite --frozen --all-groups python - <<'PY'
          import hashlib
          from pathlib import Path
          import runpy
          import zipfile

          build = runpy.run_path("rewrite/build.py")
          output = build["OUTPUT"]
          archive = output / "BeWaterTG-win64.zip"
          with zipfile.ZipFile(archive) as source:
              build["verify_members"](source.namelist())
              assert source.testzip() is None, "ZIP CRC 检查失败"
              assert source.read("BeWaterTG/README.md") == Path("README.md").read_bytes()
              for name in ("app.js", "app.css"):
                  assert source.read("BeWaterTG/_internal/static/" + name) == Path("rewrite/static", name).read_bytes()
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert (output / "SHA256SUMS.txt").read_text().split()[0] == checksum
          print("新版ZIP、操作指南、正式前端与SHA256独立核对通过：", checksum)
          PY

      - name: 输出构建失败摘要
        if: failure()
        shell: bash
        run: |
          if [ -f build-output.txt ]; then
            {
              echo '## 新版构建日志'
              echo '```'
              tail -100 build-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 只创建预发布草稿；版本名只作Action字符串输入，不拼入shell。
      # 必须实际下载核验后，再由维护者公开。
      - name: 创建新版预发布草稿
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Be Water TG ${{ github.ref_name }}
          draft: true
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            .hermes/rewrite/release/BeWaterTG-win64.zip
            .hermes/rewrite/release/SHA256SUMS.txt
          body: |
            新版中文任务板与受限自动参与的预发布候选。

            此处暂为草稿；安装包已完成云端新旧测试、隔离启动和归档审计，仍需维护者下载并独立启动核验后才公开。
            这不代表真实 Telegram／AI 或生产迁移验收通过。旧版测试的相对路径写库风险与本机旧库保护差异仍须如实保留。
