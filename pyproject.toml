[project]
name = "be-water-tg"
version = "1.0.1"
description = "Be Water TG — Telegram 抽奖群自动参与工具（Web 控制台 + 后台发送循环）"
requires-python = ">=3.11,<3.12"

[dependency-groups]
runtime = [
    "telethon==1.44.0",
    "python-dotenv==1.2.2",
    "python-socks[asyncio]==3.0.0",
    "flask==3.1.3",
    "waitress==3.0.2",
    "openai==2.24.0",
    "tzdata==2025.3",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "flet==0.86.5",
]
build = [
    "pyinstaller==6.22.2",
]
